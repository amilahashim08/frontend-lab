# Low-RAM PC: Metaspace 128m was too small for AGP 8.11 (caused mergeDebugAssets crash).
# Stop the emulator while building if build still fails (frees ~2 GB RAM).
org.gradle.jvmargs=-Xmx512m -XX:MetaspaceSize=192m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.configuration-cache=false
android.useAndroidX=true
android.newDsl=false
org.gradle.user.home=D\:\\gradle-home
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
